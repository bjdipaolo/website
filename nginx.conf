server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Clean URLs: /pricing serves pricing.html, /about serves about.html, and so on.
    # Without this, the links on the home page (/pricing, /demo, ...) are all 404s,
    # because the stock nginx image only serves a file at its exact name.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
